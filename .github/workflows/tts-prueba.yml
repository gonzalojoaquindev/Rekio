name: Prueba de historia inmersiva
on:
  workflow_dispatch:
  push:
    branches: [prueba]
permissions:
  contents: write
jobs:
  prueba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/tts-prueba.mjs
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
      - run: |
          git config user.name rekio-bot; git config user.email actions@users.noreply.github.com
          git checkout --orphan prueba-tmp; git rm -rf . >/dev/null; mkdir -p prueba; cp /tmp/prueba/* prueba/
          git add -A; git commit -m "Prueba"; git push -f origin HEAD:prueba-resultado
