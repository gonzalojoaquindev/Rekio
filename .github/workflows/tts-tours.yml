name: Grabar narraciones
on:
  push:
    branches: [audio]
permissions:
  contents: write
jobs:
  grabar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
      - run: test -f scripts/audio-tours.txt && echo "TOURS_FILE=$(cat scripts/audio-tours.txt)" >> $GITHUB_ENV || true
      - run: TOURS="${TOURS_FILE:-$TOURS}" node scripts/tts-tours.mjs
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
          TOURS: ${{ hashFiles('scripts/audio-tours.txt') != '' && '' || 'copiapo-1859,laserena-1680' }}
          VOICES: Fenrir,Iapetus,Leda,Kore
          PREVIEWS: Fenrir,Iapetus,Leda,Kore
          NAV: '1'
      - name: Subir audios a la release audio-v1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view audio-v1 >/dev/null 2>&1 || gh release create audio-v1 --prerelease --title "Narraciones (audio)" --notes "Audios de las narraciones. No es un APK."
          ls /tmp/audio/*.mp3 | xargs -n 40 gh release upload audio-v1 --clobber
      - run: |
          git config user.name rekio-bot; git config user.email actions@users.noreply.github.com
          cp /tmp/audio/audio-manifest.json /tmp/m.json
          git checkout --orphan audio-tmp; git rm -rf . >/dev/null; cp /tmp/m.json audio-manifest.json
          git add -A; git commit -m "Manifiesto de audios"; git push -f origin HEAD:audio-resultado
