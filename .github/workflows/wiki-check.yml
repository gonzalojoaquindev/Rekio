name: Consultar Wikipedia
on:
  push:
    branches: [wiki]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/wiki-check.mjs "$(cat scripts/wiki-titles.txt)" > /tmp/wiki.txt; cat /tmp/wiki.txt
      - run: sh scripts/dl-audio.sh
      - run: |
          git config user.name rekio-bot; git config user.email actions@users.noreply.github.com
          git checkout --orphan datos-tmp; git rm -rf . >/dev/null; cp /tmp/wiki.txt .; mkdir -p audio; cp /tmp/out/* audio/ 2>/dev/null || true
          git add -A; git commit -m "Resultado Wikipedia"; git push -f origin HEAD:datos
